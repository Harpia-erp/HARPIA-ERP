function $(id){return document.getElementById(id)}
function nrm(s){return (s||'').toString().trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function fmtBRDate(s){if(!s)return'';let [y,m,d]=s.split('-');return `${d}/${m}/${y}`}
function fmtNum(n){return (Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})}
function timeMin(t){if(!t)return 0; let [h,m]=t.split(':').map(Number); return (h||0)*60+(m||0)}
function hhBetween(a,b){
 let key=String(a||'')+'-'+String(b||'');
 const padrao={'07:40-17:28':8.8,'07:40-18:38':10,'07:40-12:00':4.4,'13:00-17:28':4.4,'17:28-18:38':1.2,'17:28-18:30':1.2,'18:00-04:00':10,'06:00-17:28':10.5,'23:00-09:00':10,'16:00-00:00':8,'13:00-18:38':5.6,'16:00-20:00':4,'06:00-15:00':8,'21:00-07:00':10,'00:00-00:00':0};
 if(padrao[key]!==undefined)return padrao[key];
 let x=timeMin(a),y=timeMin(b); if(y<x)y+=1440;
 let h=(y-x)/60;
 // desconta 1h de almoço quando o intervalo atravessa 12:00-13:00, como na REV.7
 let lunchStart=12*60,lunchEnd=13*60,xx=x,yy=y;
 if(xx<lunchStart && yy>lunchEnd) h-=1;
 return Math.round(h*10)/10;
}
function sectorMatch(r,setor=current.setor){
 let c=nrm((r.centro||'')+' '+(r.classificacao||'')); let ncc=String(r.ncc||'');
 if(setor==='DEP') return c==='DEP' || c.includes('DIRETO DEP') || (ncc.includes('0390.052') && !c.includes('INDIRETO'));
 return c.includes('DIRETO MANUTENCAO') || c.includes('DIRETO MANUTENÇÃO');
}
function leaderSectorMatch(r,setor=current.setor){
 let c=nrm((r.centro||'')+' '+(r.classificacao||'')); let ncc=String(r.ncc||'');
 if(setor==='DEP') return c.includes('DEP') || ncc.includes('0390.052') || ncc.endsWith('.052');
 return c.includes('MANUT') || c.includes('MANUTENCAO') || c.includes('INDIRETO CONTRATO') || ncc.includes('0390.024') || ncc.endsWith('.024');
}
function notDemitido(r){return !nrm(r.situacao).includes('DEMIT') && !r.demissao}
function isAf(r){let s=nrm(r.situacao);return s.includes('AF.PREVIDENCIA')||s.includes('AF PREVIDENCIA')||s.includes('INSS')}
function isFerias(r){return nrm(r.situacao).includes('FERIAS')}
function tipoRecurso(r,t){let x=nrm(r.tipo);return x.includes(t)||x.includes('AMBOS')}
function cardType(c){return c?.tipoCard || c?.cardType || 'PROG'}
function isExtraCard(c){let t=nrm(cardType(c));return t.includes('EXTRA')||t==='HE'||t.includes('/ HE')}
function isAbsCard(c){return nrm(cardType(c)).includes('ABSENTEISMO')||nrm(cardType(c)).includes('ABSENTEÍSMO')}
function isTurnoverCard(c){return nrm(cardType(c)).includes('TURNOVER')}
function isMobilizacaoCard(c){return nrm(cardType(c)).includes('MOBILIZACAO')||nrm(cardType(c)).includes('MOBILIZAÇÃO')}
function isProductiveCard(c){return nrm(cardType(c))==='PROG'||isExtraCard(c)}
function cardMotivoOptions(c){if(isAbsCard(c))return ABSENTEISMO_OPTIONS;if(isTurnoverCard(c))return TURNOVER_OPTIONS;if(isMobilizacaoCard(c))return MOBILIZACAO_OPTIONS;return [''];}
function defaultMotivo(c){let a=cardMotivoOptions(c);return a[0]||''}
function specialTitle(c){let m=nrm(c.motivo||'');if(isAbsCard(c)){if(m.includes('FALTA')||m.includes('ATESTADO'))return 'COLABORADORES EM FALTA / ATESTADO';if(m.includes('TREINAMENTO'))return 'COLABORADORES EM TREINAMENTO';if(m.includes('EPI'))return "COLABORADORES SEM EPI'S";if(m.includes('UNIFORME'))return 'COLABORADORES SEM UNIFORME';if(m.includes('ACESSO'))return 'COLABORADORES SEM ACESSO';if(m.includes('CANTEIRO'))return 'COLABORADOR ALOCADO NO CANTEIRO';return 'COLABORADORES EM ABSENTEÍSMO';}
 if(isTurnoverCard(c)){return 'TURNOVER - '+(c.motivo||'MOTIVO');}
 if(isMobilizacaoCard(c)){return 'MOBILIZAÇÃO - '+(c.motivo||'MOTIVO');}
 return c.descricao||'Descrição da atividade';}
function intervalOverlap(a,b,c,d){let x=timeMin(a),y=timeMin(b),u=timeMin(c),v=timeMin(d);if(y<x)y+=1440;if(v<u)v+=1440;return x<v && u<y;}

function funcAbbrev(f){let s=nrm(f);if(s.includes('AUXILIAR'))return 'AUX';if(s.includes('OFICIAL'))return 'OF';if(s.includes('ELETRIC'))return 'ELE';if(s.includes('LIDER'))return 'LIDER';if(s.includes('SUPERVISOR'))return 'SUP';if(s.includes('ENCAR'))return 'ENC';if(s.includes('TOPO'))return 'TOPO';if(s.includes('ALMOX'))return 'ALMOX';if(s.includes('PLANEJ'))return 'PLAN';return (f||'').split(' ')[0]||''}
function displayName(r){if(!r)return'';let nome=(r.nome||'').trim().replace(/\s+/g,' ');if(!nome||nome==='0')return'';let base=nome;if(nome.length>25){let pos=nome.indexOf(' ',14);let corte=pos>-1?pos:25;let primeiro=nome.substring(0,corte).trim();let partes=nome.split(' ');let ultimo=partes[partes.length-1]||'';base=(primeiro.endsWith(ultimo)?primeiro:(primeiro+' '+ultimo)).trim();}return (base+' - '+funcAbbrev(r.funcao)).trim()}
function findResourceByDisplay(name){let pure=nrm((name||'').split(' - ')[0]);return state.resources.find(r=>nrm(displayName(r))===nrm(name)||nrm(r.nome)===pure||nrm(r.nome).startsWith(pure))}

function cardsOfDay(){return state.cards.filter(c=>c.data===current.data && c.setor===current.setor)}
function usedNamesByRule(card, mode='NORMAL'){
 let set=new Set();
 cardsOfDay().forEach(c=>{if(c.id===card.id)return;let overlap=intervalOverlap(card.inicio,card.fim,c.inicio,c.fim);
   if(mode==='HE'){
     if(!(isExtraCard(c)&&overlap))return;
   }else{
     if(isExtraCard(c))return;
     if(isTurnoverCard(c)||isMobilizacaoCard(c))overlap=true;
     if(!overlap)return;
   }
   (c.colabs||[]).forEach(x=>{if(x)set.add(nrm(x))});
 });
 return set;
}
function availableOptions(card, selected, slotIndex){let used=usedNamesByRule(card,isExtraCard(card)?'HE':'NORMAL'); let opts=[''];
 (card.colabs||[]).forEach((name,idx)=>{if(idx!==slotIndex && name) used.add(nrm(name))});
 state.resources.filter(r=>notDemitido(r)&&sectorMatch(r)&&tipoRecurso(r,'COLABORADOR')&&!isAf(r)&&!isFerias(r)).forEach(r=>{let dn=displayName(r); if(!used.has(nrm(dn))||nrm(dn)===nrm(selected)) opts.push(dn)}); return opts;
}

function gerarDMSData(){
 let oldRows=state.dmsRows||[];
 let oldById={}; oldRows.forEach(r=>{if(r&&r.idServico)oldById[r.idServico]=r});
 let lockedById={}; oldRows.filter(isDmsLancado).forEach(r=>{if(r.idServico)lockedById[r.idServico]=JSON.parse(JSON.stringify(r))});
 let map={}; let order=[];
 allMedicaoRows().forEach(d=>{
   let id=d.idServico;if(!id)return;
   if(!map[id]){map[id]={rdo:d.rdo,ordem:d.ordem,fiscal:d.fiscal,area:d.area,data:fmtBRDate(d.data),rec:new Set(),descricao:d.descricao,hhNormal:0,evento15:0,evento17:0,evento20:0,valor:0,tipo:d.atividade,idServico:id,status:'DMS PENDENTE'};order.push(id)};
   map[id].rec.add(d.nomeColaborador);map[id].hhNormal+=numBR(d.hh10)||numBR(d.hhManserv);map[id].evento15+=numBR(d.hh15);map[id].evento17+=numBR(d.hh17);map[id].evento20+=numBR(d.hh20);map[id].valor+=numBR(d.valorCobranca)||numBR(d.valorPrevisto)
 });
 let result=[]; let usedLocked=new Set();
 order.forEach(id=>{
   if(lockedById[id]){result.push(lockedById[id]);usedLocked.add(id);return;}
   let x=map[id];let o=oldById[id]||{};x.nrec=x.rec.size;delete x.rec;
   ['area','rdo','fiscal','valor'].forEach(k=>{if(o[k]!==undefined&&o[k]!=='' )x[k]=o[k]});
   x.status='DMS PENDENTE';
   x.hhNormal=fmtNum(x.hhNormal);x.evento15=x.evento15?fmtNum(x.evento15):'';x.evento17=x.evento17?fmtNum(x.evento17):'';x.evento20=x.evento20?fmtNum(x.evento20):'';x.valor=x.valor?fmtNum(x.valor):'';result.push(x)
 });
 oldRows.filter(isDmsLancado).forEach(r=>{if(r.idServico&&!usedLocked.has(r.idServico))result.push(JSON.parse(JSON.stringify(r)))});
 state.dmsRows=result;save();
}

function renderHHColab(){let all=allMedicaoRows();let dates=Array.from(new Set(all.map(d=>d.data).filter(Boolean))).sort();let m={};all.forEach(d=>{let k=d.re||d.nomeColaborador;if(!m[k])m[k]={re:d.re,nome:d.nomeColaborador,func:d.func,situacao:d.situacao,origem:(state.detalhes||[]).includes(d)?'DETALHES':'NOTAS',first:d.data,last:d.data,det:0,notas:0,by:{}};m[k].first=m[k].first<d.data?m[k].first:d.data;m[k].last=m[k].last>d.data?m[k].last:d.data;if((state.notas||[]).includes(d))m[k].notas++;else m[k].det++;m[k].by[d.data]=(m[k].by[d.data]||0)+numBR(d.hhManserv)});let headers=['RE','Nome do Colaborador','Função','Situação','Origem','Primeira Data','Última Data','Qtd Linhas Detalhes','Qtd Linhas Notas',...dates.map(fmtBRDate)];let rows=Object.values(m).sort((a,b)=>String(a.nome).localeCompare(String(b.nome))).map(x=>[x.re,x.nome,x.func,x.situacao,x.origem,fmtBRDate(x.first),fmtBRDate(x.last),x.det,x.notas,...dates.map(dt=>x.by[dt]?fmtNum(x.by[dt]):'')]);renderTable('hhcolab',headers,rows)}
function numBR(v){if(typeof v==='number')return v;let s=String(v||'').replace('.','').replace(',','.');let n=parseFloat(s);return isNaN(n)?0:n}

function renderRecursos(){
  let activeId=document.activeElement?document.activeElement.id:'';

  let buscaAtual = activeId==='rBusca' ? document.activeElement.value : ($('rBusca')?.value||'');

  let tipoAtual = $('rTipo')?.value||'Todos tipos';
  let setorOpts=['Todos setores','MANUTENÇÃO','DEP'];
  let tipoOpts=['Todos tipos','COLABORADOR','LÍDER','AMBOS'];
  let filters=`<div class="toolbar"><input id="rBusca" placeholder="Busca nome, RE, função..." oninput="renderRecursos()" value="${escapeHTML(buscaAtual)}" autocomplete="off"><select id="rSetor" onchange="renderRecursos()">${setorOpts.map(o=>`<option ${o===setorAtual?'selected':''}>${o}</option>`).join('')}</select><select id="rTipo" onchange="renderRecursos()">${tipoOpts.map(o=>`<option ${o===tipoAtual?'selected':''}>${o}</option>`).join('')}</select><b>Total filtrado: <span id="totalRec"></span></b></div>`;
  let form=`<div class="form-grid"><div><label>RE</label><input id="fRe"></div><div><label>Funcionário</label><input id="fNome"></div><div><label>Função</label><input id="fFunc"></div><div><label>Situação</label><select id="fSit"><option>Ativo</option><option>Af.Previdencia</option><option>Férias</option><option>Demitido</option></select></div><div><label>Classificação</label><select id="fClass"><option>DIRETO MANUTENÇÃO</option><option>DEP</option><option>INDIRETO CONTRATO</option><option>INDIRETO DEP</option></select></div><div><label>Centro Custo</label><select id="fCentro"><option>MANUTENÇÃO</option><option>DEP</option><option>DIRETO MANUTENÇÃO</option></select></div><div><label>Nº CC</label><input id="fNcc"></div><div><label>Tipo</label><select id="fTipo"><option>COLABORADOR</option><option>LÍDER</option><option>AMBOS</option></select></div><div style="align-self:end"><button class="btn green" onclick="saveRecurso()">Salvar recurso</button></div></div>`;
  let busca=nrm(buscaAtual),setor=setorAtual,tipo=tipoAtual;
  let rows=state.resources.filter(r=>(!busca||nrm(Object.values(r).join(' ')).includes(busca))&&(setor==='Todos setores'||sectorMatch(r,setor))&&(tipo==='Todos tipos'||nrm(r.tipo).includes(nrm(tipo))));
  let table=`<div class="table-wrap"><table class="data-table"><thead><tr>${['Nº','RE','FUNCIONÁRIO','FUNÇÃO','ADMISSÃO','DEMISSÃO','SITUAÇÃO','CLASSIFICAÇÃO','CENTRO CUSTO','Nº CC','TIPO','AÇÕES'].map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${escapeHTML(r.re)}</td><td>${escapeHTML(r.nome)}</td><td>${escapeHTML(r.funcao)}</td><td>${escapeHTML(r.admissao)}</td><td>${escapeHTML(r.demissao)}</td><td>${escapeHTML(r.situacao)}</td><td>${escapeHTML(r.classificacao)}</td><td>${escapeHTML(r.centro)}</td><td>${escapeHTML(r.ncc)}</td><td>${escapeHTML(r.tipo)}</td><td><button onclick="editRecurso('${escapeHTML(r.re)}')">Editar</button> <button onclick="delRecurso('${escapeHTML(r.re)}')">Excluir</button></td></tr>`).join('')}</tbody></table></div>`;
  $('recursos').innerHTML=filters+form+table;
  if($('totalRec'))$('totalRec').textContent=rows.length;
  if(activeId==='rBusca'){
    setTimeout(()=>{let el=$('rBusca'); if(el){el.focus(); let p=caret??el.value.length; try{el.setSelectionRange(p,p)}catch(e){}}},0);
  }
}
function saveRecurso(){let r={re:$('fRe').value,nome:$('fNome').value.toUpperCase(),funcao:$('fFunc').value.toUpperCase(),admissao:'',demissao:'',situacao:$('fSit').value,classificacao:$('fClass').value,centro:$('fCentro').value,ncc:$('fNcc').value,tipo:$('fTipo').value};let idx=state.resources.findIndex(x=>x.re===r.re);if(idx>=0)state.resources[idx]={...state.resources[idx],...r};else state.resources.push(r);current.editRe=null;save();renderRecursos()}
function delRecurso(re){if(confirm('Excluir recurso? Se tiver histórico, prefira alterar para Demitido.')){state.resources=state.resources.filter(r=>r.re!==re);save();renderRecursos()}}
function renderBase(){let turnos=state.turnos.map(t=>[t.turno,t.inicio,t.fim]);let tipos=state.tipos.map(t=>[t.tipo,t.departamento]);let fiscais=state.fiscais.map(f=>[f.nome,f.email]);$('base').innerHTML=`<div class="compact-cards"><div class="base-card"><h3>Turnos</h3><table class="data-table"><tr><th>Turno</th><th>Início</th><th>Fim</th></tr>${turnos.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table></div><div class="base-card"><h3>Tipos T.O</h3><table class="data-table"><tr><th>Tipo</th><th>Depto</th></tr>${tipos.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div><div class="base-card"><h3>Fiscais</h3><table class="data-table"><tr><th>Nome</th><th>E-mail</th></tr>${fiscais.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div><div class="base-card"><h3>Líderes via Recursos</h3><p class="muted">Filtrados pelo centro de custo na programação.</p><b>${state.resources.filter(r=>tipoRecurso(r,'LIDER')).length}</b></div></div>`}

/* ===== Modelo 23 — Fase Harpia ===== */
const LOSS_REASONS_DEFAULT=['ESPERA DE MATERIAL','LIBERAÇÃO DE ÁREA','CLIMA','FALTA DE ACESSO','FALTA DE FRENTE','AGUARDANDO FISCAL','AGUARDANDO EQUIPAMENTO','INTERFERÊNCIA OPERACIONAL','RETRABALHO','OUTROS'];
function nowAudit(){return new Date().toLocaleString('pt-BR');}
function ensureHarpia(){state.auditLogs=state.auditLogs||[];state.lossReasons=state.lossReasons&&state.lossReasons.length?state.lossReasons:LOSS_REASONS_DEFAULT.slice();state.usuarioAtual=state.usuarioAtual||'GESTOR';state.cards=state.cards||[];state.cards.forEach(c=>{if(c.heAutorizado===undefined)c.heAutorizado=false;if(c.heResponsavel===undefined)c.heResponsavel='';if(c.heJustificativa===undefined)c.heJustificativa='';if(c.hhPerda===undefined)c.hhPerda='';if(c.motivoPerda===undefined)c.motivoPerda='';if(c.descPerda===undefined)c.descPerda='';});state.appVersion='Modelo 23';}
function auditLog(acao,modulo,referencia,campo,antigo,novo,justificativa){ensureHarpia();state.auditLogs.unshift({id:'AUD'+Date.now()+Math.random().toString(36).slice(2,6),dataHora:nowAudit(),usuario:state.usuarioAtual||'GESTOR',acao,modulo,referencia,campo,antigo:String(antigo??''),novo:String(novo??''),justificativa:String(justificativa??'')}); if(state.auditLogs.length>2000)state.auditLogs.length=2000;}
function lossOptions(v){ensureHarpia();return [''].concat(state.lossReasons).map(x=>`<option ${nrm(x)===nrm(v)?'selected':''}>${escapeHTML(x)}</option>`).join('')}
function harpiaCardBlock(c,locked){ensureHarpia(); if(!isProductiveCard(c))return '';
 let extra=isExtraCard(c)?`<label>HE AUT.</label><select ${locked?'disabled':''} onchange="upd('${c.id}','heAutorizado',this.value==='SIM')"><option ${c.heAutorizado?'selected':''}>SIM</option><option ${!c.heAutorizado?'selected':''}>NÃO</option></select><label>RESP. HE</label><input ${locked?'disabled':''} value="${escapeHTML(c.heResponsavel||'')}" onchange="upd('${c.id}','heResponsavel',this.value)"><label class="wide">JUSTIF. HE</label><input class="wide" ${locked?'disabled':''} value="${escapeHTML(c.heJustificativa||'')}" onchange="upd('${c.id}','heJustificativa',this.value)">`:'';
 let perda=`<label>HH PERDA</label><input ${locked?'disabled':''} value="${escapeHTML(c.hhPerda||'')}" onchange="upd('${c.id}','hhPerda',this.value)" placeholder="0,0"><label>MOTIVO PERDA</label><select ${locked?'disabled':''} onchange="upd('${c.id}','motivoPerda',this.value)">${lossOptions(c.motivoPerda)}</select><label class="wide">DESC. PERDA</label><input class="wide" ${locked?'disabled':''} value="${escapeHTML(c.descPerda||'')}" onchange="upd('${c.id}','descPerda',this.value)" placeholder="Obrigatório quando houver HH perda">`;
 return `<div class="harpia-strip">${extra}${perda}</div>`;}
function hasPerda(c){return numBR(c.hhPerda)>0 || !!String(c.motivoPerda||'').trim() || !!String(c.descPerda||'').trim();}
function cardPendencias(c){let p=[]; if(isProductiveCard(c)){if(!String(c.fiscal||'').trim()||nrm(c.fiscal)==='N/A')p.push('card sem fiscal'); if(!String(c.ordem||'').trim()||nrm(c.ordem)==='PJ'||nrm(c.ordem)==='N/A')p.push('card sem ordem de manutenção');}
 if(isExtraCard(c)&&!c.heAutorizado)p.push('HE/EXTRA sem autorização formal'); if(hasPerda(c)){if(!String(c.motivoPerda||'').trim())p.push('HH perda sem motivo'); if(!String(c.descPerda||'').trim())p.push('HH perda sem descrição');}
 return p;}
function validateCardForSave(c,show=true){let p=cardPendencias(c); if(p.length&&show){alert('Pendências da Fase Harpia no card '+String(c.micro).padStart(2,'0')+':\n- '+p.join('\n- '));} return p.length===0;}
function kpiHarpia(){let det=detalheRows?detalheRows():[];let cards=cardsOfDay();let prodHH=det.reduce((s,d)=>s+numBR(d.hhApropFisico||d.hhManserv),0);let progHH=cards.filter(isProductiveCard).reduce((s,c)=>s+(hhBetween(c.inicio,c.fim)*(c.colabs||[]).filter(Boolean).length),0);let perdaHH=cards.reduce((s,c)=>s+numBR(c.hhPerda)*(c.colabs||[]).filter(Boolean).length,0);let concl=cards.filter(c=>c.status==='SALVO'||c.status==='CONFIRMADO').length;let pend=cards.reduce((s,c)=>s+cardPendencias(c).length,0);let dmsPend=(state.dmsRows||[]).filter(r=>!String(r.rdo||'').trim()).length;return{prodHH,progHH,perdaHH,produtividade:progHH?prodHH/progHH*100:0,indicePerda:(prodHH+perdaHH)?perdaHH/(prodHH+perdaHH)*100:0,acuracidade:cards.length?concl/cards.length*100:0,pendencias:pend+dmsPend,dmsSemRdo:dmsPend};}
const oldSaveCard=saveCard; saveCard=function(id){let c=state.cards.find(x=>x.id===id); if(!c)return; if(!validateCardForSave(c,true))return; auditLog('SALVAR CARD','PROGRAMAÇÃO',String(c.micro).padStart(2,'0'),'status',c.status,'SALVO','Validação Fase Harpia aprovada'); oldSaveCard(id);}
const oldSaveAll=saveAll; saveAll=function(){let cards=cardsOfDay().filter(c=>c.colabs && c.colabs.filter(Boolean).length);let invalid=cards.filter(c=>!validateCardForSave(c,false)); if(invalid.length){alert('Existem cards com pendências da Fase Harpia. Corrija antes de registrar detalhes.\nCards: '+invalid.map(c=>String(c.micro).padStart(2,'0')).join(', '));return;} auditLog('REGISTRAR DETALHES','PROGRAMAÇÃO',fmtBRDate(current.data),'cards','',cards.length+' cards','Validação em lote aprovada'); oldSaveAll();}
const oldEditDMS=editDMS; editDMS=function(i,f,v){if(!state.dmsRows||!state.dmsRows[i])return;let r=state.dmsRows[i];let old=r[f]??''; if(isDmsLancado(r)){let just=prompt('DMS LANÇADO está bloqueado. Informe a justificativa da tentativa de alteração para registrar auditoria:'); if(just){auditLog('TENTATIVA BLOQUEADA','DMS',r.idServico||r.rdo||i,f,old,v,just);save();} renderDMS();return;} if(f==='status'&&nrm(v).includes('LANCADO')&&!String(r.rdo||'').trim()){alert('Não é permitido lançar DMS sem RDO.'); auditLog('BLOQUEIO VALIDAÇÃO','DMS',r.idServico||i,'status',old,v,'DMS sem RDO'); renderDMS();return;} r[f]=String(v??'').trim(); auditLog('ALTERAÇÃO','DMS',r.idServico||r.rdo||i,f,old,r[f],'Edição direta em DMS pendente'); save();renderDMS();}
function dmsAuditAttempt(i){let r=state.dmsRows[i]; if(!r)return; let just=prompt('Registre a justificativa da tentativa/necessidade de alteração nesta DMS lançada:'); if(!just)return; auditLog('SOLICITAÇÃO ALTERAÇÃO','DMS',r.idServico||r.rdo||i,'DMS LANÇADO','','',just);save();renderAuditoria&&renderAuditoria();alert('Registro enviado para Auditoria.');}
const oldRenderDMS=renderDMS; renderDMS=function(){oldRenderDMS(); let tbl=$('dms')?.querySelector('table'); if(!tbl)return; [...tbl.tBodies[0].rows].forEach((tr,ri)=>{let row=dmsFilteredRows()[ri]; if(!row)return; if(!String(row.rdo||'').trim())tr.classList.add('pendencia'); if(isDmsLancado(row)){let idx=(state.dmsRows||[]).indexOf(row);let cell=tr.cells[tr.cells.length-1]; if(cell&&!cell.querySelector('.dms-audit-btn'))cell.insertAdjacentHTML('beforeend',`<br><button class="dms-audit-btn" onclick="dmsAuditAttempt(${idx})">Auditoria</button>`);}}); let k=kpiHarpia(); let tb=$('dms').querySelector('.toolbar'); if(tb&&!tb.querySelector('.harpia-alert'))tb.insertAdjacentHTML('beforeend', k.dmsSemRdo?`<span class="harpia-alert">${k.dmsSemRdo} DMS sem RDO</span>`:`<span class="harpia-ok">DMS sem RDO: 0</span>`);}
const oldRenderDashboard=renderDashboard; renderDashboard=function(){oldRenderDashboard(); let k=kpiHarpia(); let html=`<div class="toolbar"><span class="harpia-badge">FASE HARPIA — Base normativa e auditoria</span><button class="btn blue" onclick="changePage('auditoria')">Abrir Auditoria</button><span>${k.pendencias} pendência(s) de validação</span></div><div class="audit-grid"><div class="audit-card"><h3>Produtividade HH</h3><div class="big">${k.produtividade.toFixed(1).replace('.',',')}%</div><small>HH apropriado / HH programado</small></div><div class="audit-card"><h3>Índice de Perda</h3><div class="big">${k.indicePerda.toFixed(1).replace('.',',')}%</div><small>HH perda / HH total</small></div><div class="audit-card"><h3>Acuracidade Programação</h3><div class="big">${k.acuracidade.toFixed(1).replace('.',',')}%</div><small>Cards confirmados/salvos</small></div><div class="audit-card"><h3>Pendências Validação</h3><div class="big">${k.pendencias}</div><small>Cards + DMS sem RDO</small></div></div>`; $('dashboard').insertAdjacentHTML('afterbegin',html);}
function renderAuditoria(){ensureHarpia();let k=kpiHarpia();let pendCards=state.cards.flatMap(c=>cardPendencias(c).map(p=>({ref:'Card '+String(c.micro).padStart(2,'0'),tipo:p,data:fmtBRDate(c.data)})));let pendDms=(state.dmsRows||[]).filter(r=>!String(r.rdo||'').trim()).map(r=>({ref:r.idServico||r.ordem||'',tipo:'DMS sem RDO',data:r.data||''}));let logs=state.auditLogs||[];$('auditoria').innerHTML=`<div class="toolbar"><span class="harpia-badge">Modelo 23 — Fase Harpia</span><b>Usuário:</b><input value="${escapeHTML(state.usuarioAtual||'GESTOR')}" onchange="state.usuarioAtual=this.value||'GESTOR';save();renderAuditoria()"><button class="btn" onclick="exportCSV('auditoria')">Exportar Auditoria CSV</button><button class="btn red" onclick="if(confirm('Limpar logs de auditoria?')){state.auditLogs=[];save();renderAuditoria()}">Limpar logs</button></div><div class="audit-grid"><div class="audit-card"><h3>Produtividade HH</h3><div class="big">${k.produtividade.toFixed(1).replace('.',',')}%</div><small>Meta > 85%</small></div><div class="audit-card"><h3>Índice de Perda</h3><div class="big">${k.indicePerda.toFixed(1).replace('.',',')}%</div><small>Meta < 10%</small></div><div class="audit-card"><h3>Acuracidade</h3><div class="big">${k.acuracidade.toFixed(1).replace('.',',')}%</div><small>Meta > 90%</small></div><div class="audit-card"><h3>Lead/Pendências</h3><div class="big">${k.pendencias}</div><small>Validação pendente</small></div></div><div class="toolbar"><b>Dicionário de Perdas:</b>${state.lossReasons.map(x=>`<span class="loss-chip">${escapeHTML(x)}</span>`).join('')}<button class="btn" onclick="addLossReason()">+ Motivo</button></div><h3>Pendências automáticas</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>Referência</th><th>Pendência</th><th>Data</th></tr></thead><tbody>${[...pendCards,...pendDms].map(p=>`<tr class="pendencia"><td>${escapeHTML(p.ref)}</td><td>${escapeHTML(p.tipo)}</td><td>${escapeHTML(p.data)}</td></tr>`).join('')||'<tr><td colspan="3">Nenhuma pendência encontrada.</td></tr>'}</tbody></table></div><h3>Log de auditoria</h3><div class="table-wrap"><table class="data-table audit-table"><thead><tr><th>Data/Hora</th><th>Usuário</th><th>Ação</th><th>Módulo</th><th>Referência</th><th>Campo</th><th>Valor antigo</th><th>Valor novo</th><th>Justificativa</th></tr></thead><tbody>${logs.map(l=>`<tr><td>${escapeHTML(l.dataHora)}</td><td>${escapeHTML(l.usuario)}</td><td>${escapeHTML(l.acao)}</td><td>${escapeHTML(l.modulo)}</td><td>${escapeHTML(l.referencia)}</td><td>${escapeHTML(l.campo)}</td><td>${escapeHTML(l.antigo)}</td><td>${escapeHTML(l.novo)}</td><td class="pre">${escapeHTML(l.justificativa)}</td></tr>`).join('')||'<tr><td colspan="9">Sem registros ainda.</td></tr>'}</tbody></table></div>`;}
function addLossReason(){ensureHarpia();let v=prompt('Novo motivo de perda:'); if(!v)return; if(!state.lossReasons.some(x=>nrm(x)===nrm(v)))state.lossReasons.push(v.toUpperCase());save();renderAuditoria();}

function renderRelCC(){let rows=detalheRows().map(d=>[fmtBRDate(d.data),d.custo2||d.centroCusto,d.re,d.nomeColaborador,d.func,d.hhManserv,d.atividade]);renderTable('relcc',['DATA','SETOR/CUSTO2','RE','COLABORADOR','FUNÇÃO','HH','T.O'],rows)}
function renderPage(id){({dashboard:renderDashboard,programacao:renderProgramacao,detalhes:renderDetalhes,dms:renderDMS,notas:renderNotas,resumoLider:renderResumoLider,hhcolab:renderHHColab,recursos:renderRecursos,base:renderBase,auditoria:renderAuditoria,relcc:renderRelCC}[id]||renderDashboard)()}
