<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b2a38" />
    <meta name="description" content="HARPIA ERP — Planejamento, controle e gestão integrada." />
    <link rel="icon" type="image/png" href="./harpia-mark.png" />
    <title>HARPIA ERP — Gestão Integrada</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div id="root"><p style="font-family:Arial;padding:24px">Carregando o HARPIA ERP…</p></div>
    <script>
      /* Compatibilidade para publicação estática em domínio próprio. */
      window.process = window.process || { env: { NODE_ENV: "production" } };

      /*
       * Enquanto não houver backend corporativo, os registros criados nesta
       * demonstração permanecem somente no navegador do próprio usuário.
       */
      (function () {
        const fetchOriginal = window.fetch.bind(window);
        window.fetch = async function (entrada, opcoes) {
          const endereco = typeof entrada === "string" ? entrada : entrada && entrada.url;
          if (endereco && /\/api\/planning(?:\?.*)?$/.test(endereco)) {
            const metodo = String((opcoes && opcoes.method) || "GET").toUpperCase();
            if (metodo === "POST") {
              try {
                localStorage.setItem("harpia_planejamento", String((opcoes && opcoes.body) || "{}"));
                return new Response(JSON.stringify({ ok: true }), {
                  status: 200,
                  headers: { "content-type": "application/json" }
                });
              } catch (erro) {
                return new Response(JSON.stringify({ ok: false }), {
                  status: 500,
                  headers: { "content-type": "application/json" }
                });
              }
            }

            const salvo = localStorage.getItem("harpia_planejamento");
            return new Response(JSON.stringify({ data: salvo ? JSON.parse(salvo) : null }), {
              status: 200,
              headers: { "content-type": "application/json" }
            });
          }
          return fetchOriginal(entrada, opcoes);
        };
      })();
    </script>
    <script>
      window.addEventListener("error", function (event) {
        document.getElementById("root").innerHTML =
          '<main style="font-family:Arial;padding:32px;color:#721c24">' +
          '<h1>Não foi possível iniciar o HARPIA ERP</h1>' +
          '<p>Abra o arquivo <b>INICIAR_HARPIA.bat</b> para executar o sistema.</p>' +
          '<small>' + String(event.message || "Erro de carregamento") + '</small></main>';
      });
    </script>
    <script src="./js/app.js" onerror="document.getElementById('root').innerHTML='<h2 style=&quot;font-family:Arial;padding:32px&quot;>Execute INICIAR_HARPIA.bat</h2>'"></script>
  </body>
</html>
